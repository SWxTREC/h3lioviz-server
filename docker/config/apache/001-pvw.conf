<VirtualHost *:80>
    DocumentRoot /pvw/www/
    ErrorLog /var/log/apache2/001-pvw_error.log
    CustomLog /var/log/apache2/001-pvw_access.log combined
    Header add Access-Control-Allow-Origin "*"

    <Directory /pvw/www/>
        Options Indexes FollowSymLinks
        DirectoryIndex index.html
        Order allow,deny
        Allow from all
        AllowOverride None
        Require all granted
    </Directory>

    # APPLICATION-ENDPOINTS

    # Handle launcher forwarding
    # TODO: May need to switch this to /launcher in future versions
    ProxyPass /paraview http://localhost:9000/paraview
    # Handle websocket forwarding
    ProxyPass /proxy ws://localhost:9000/proxy

    # Handle flask forwarding. Note ProxyPassReverse will rewrite flask headers to be consistent with apache's server name
    ProxyPreserveHost On
    ProxyPass /metadata http://localhost:5000/metadata
    ProxyPassReverse /metadata http://localhost:5000/metadata

    # Handle WebSocket forwarding
    RewriteEngine On

    # Redirect root to the h3lioviz SPA entry point
    RewriteRule ^/?$ /h3lioviz/ [R=302,L]

    # Support legacy /helioviz entry by forwarding to /h3lioviz
    RewriteRule ^/helioviz/?$ /h3lioviz/ [R=302,L]

    # Generic h3lioviz SPA client-side routes -> serve index.html for non-file paths
    RewriteCond %{REQUEST_URI} !\.[^/]+$
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^/h3lioviz(/.*)?$ /h3lioviz/index.html [L]

    RewriteMap session-to-port txt:/opt/launcher/proxy-mapping.txt
    RewriteCond %{QUERY_STRING} ^sessionId=(.*)&path=(.*)$ [NC]
    RewriteRule ^/proxy.*$  ws://${session-to-port:%1}/%2  [P]
</VirtualHost>